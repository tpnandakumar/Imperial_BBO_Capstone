<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">Imperial BBO Capstone visual gateway</title>
  <desc id="description">Thirteen rounds, eight hidden functions, 104 prospective queries and one evidence-led optimisation story.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f5f2"/>
      <stop offset="0.52" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#eee8f8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b9f98"/>
      <stop offset="0.5" stop-color="#7b76ae"/>
      <stop offset="1" stop-color="#d8879f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#263b5b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="620" rx="38" fill="url(#background)"/>
  <circle cx="1460" cy="75" r="190" fill="#ffffff" opacity="0.28"/>
  <circle cx="1510" cy="30" r="125" fill="none" stroke="#8794bb" stroke-width="2" opacity="0.22"/>
  <rect x="86" y="68" width="280" height="42" rx="21" fill="#ffffff" opacity="0.76"/>
  <text x="226" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#507f7b">IMPERIAL BBO CAPSTONE</text>
  <text x="86" y="190" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#243b62">Thirteen rounds.</text>
  <text x="86" y="270" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#243b62">Eight hidden functions.</text>
  <text x="88" y="326" font-family="Arial, sans-serif" font-size="25" fill="#5b6e89">From supplied starter observations to a reproducible, evidence-led search.</text>
  <path d="M90 380 C260 330 370 420 515 372 S775 325 915 375 S1160 435 1320 354 S1435 345 1510 312" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round"/>
  <g fill="#ffffff" stroke-width="5">
    <circle cx="90" cy="380" r="11" stroke="#5b9f98"/>
    <circle cx="515" cy="372" r="11" stroke="#718c9f"/>
    <circle cx="915" cy="375" r="11" stroke="#8574ae"/>
    <circle cx="1320" cy="354" r="11" stroke="#c07d9f"/>
    <circle cx="1510" cy="312" r="15" stroke="#d8879f"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="86" y="443" width="310" height="112" rx="22" fill="#ffffff" opacity="0.88"/>
    <rect x="420" y="443" width="310" height="112" rx="22" fill="#ffffff" opacity="0.88"/>
    <rect x="754" y="443" width="310" height="112" rx="22" fill="#ffffff" opacity="0.88"/>
    <rect x="1088" y="443" width="424" height="112" rx="22" fill="#ffffff" opacity="0.88"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#243b62">
    <text x="116" y="487" font-size="17" font-weight="700" letter-spacing="2">STARTER EVIDENCE</text>
    <text x="116" y="529" font-size="32" font-weight="700">175 observations</text>
    <text x="450" y="487" font-size="17" font-weight="700" letter-spacing="2">PROSPECTIVE SEARCH</text>
    <text x="450" y="529" font-size="32" font-weight="700">104 queries</text>
    <text x="784" y="487" font-size="17" font-weight="700" letter-spacing="2">HIDDEN LANDSCAPES</text>
    <text x="784" y="529" font-size="32" font-weight="700">2 to 8 dimensions</text>
    <text x="1118" y="487" font-size="17" font-weight="700" letter-spacing="2">READING ROUTES</text>
    <text x="1118" y="529" font-size="28" font-weight="700">Weeks · Functions · Resolution</text>
  </g>
</svg>
