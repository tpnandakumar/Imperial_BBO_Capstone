<text x="75" y="813" font-family="Arial" font-size="13" fill="#334155">The table links clustering evidence available at the end of Week 10 to the Week 11 query strategy. Distances are normalised by the square root of dimensionality.</text>
<text x="75" y="831" font-family="Arial" font-size="13" fill="#334155">Week 11 outputs are excluded, so the final column records a downstream optimisation decision rather than retrospective evidence.</text>
