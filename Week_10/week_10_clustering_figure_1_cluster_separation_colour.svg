<text x="75" y="695" font-family="Arial" font-size="13" fill="#334155">Each function is analysed independently. Higher silhouette scores indicate clearer separation between sampled neighbourhoods.</text>
<text x="75" y="716" font-family="Arial" font-size="13" fill="#334155">With only ten observations per function, these clusters guide exploration and refinement but do not establish global function structure.</text>
