<text x="75" y="695" font-family="Arial" font-size="13" fill="#334155">Function 5 rose from 1415.876 in Week 1 to 4394.868 by Week 9. Week 10 repeated the same query and reproduced 4394.868 exactly.</text>
<text x="75" y="716" font-family="Arial" font-size="13" fill="#334155">The later high outputs lie close to the Week 10 point, supporting cautious local exploitation while not proving that the global optimum has been reached.</text>
