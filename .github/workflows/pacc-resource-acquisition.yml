name: PACC Minimal Resource Acquisition

on:
  workflow_dispatch:
  push:
    branches:
      - agent/pframos-v0.1
    paths:
      - "PFRAMOS/training_scout/acquire_first_open_resources.py"
      - "PFRAMOS/training_scout/FIRST_RESOURCE_ACQUISITION_MANIFEST.json"
      - ".github/workflows/pacc-resource-acquisition.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  acquire-minimal-trial-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Acquire COCO BBOB and OpenML metadata
        run: |
          python PFRAMOS/training_scout/acquire_first_open_resources.py \
            --output-dir PFRAMOS/trial_runs/resource_cache

      - name: Upload minimal acquisition bundle
        uses: actions/upload-artifact@v4
        with:
          name: pacc-minimal-resource-acquisition
          path: PFRAMOS/trial_runs/resource_cache/
          retention-days: 30
