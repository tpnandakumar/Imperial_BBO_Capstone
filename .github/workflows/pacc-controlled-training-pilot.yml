name: PACC Controlled Training Pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pilot mode
        required: true
        default: shadow
        type: choice
        options:
          - shadow
          - synthetic
          - repository_owned
      lane:
        description: Cognitive training lane
        required: true
        default: semantic_and_language
        type: choice
        options:
          - attention_and_working_memory
          - episodic_and_retrieval
          - semantic_and_language
          - executive_and_abstraction
          - visuospatial_and_praxis
          - social_and_metacognitive

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run PACC architecture and governance tests
        run: |
          pytest -q \
            PFRAMOS/tests/test_ac_minimum_memory_circuit.py \
            PFRAMOS/tests/test_cognitive_enhancement.py \
            PFRAMOS/tests/test_dynamic_function_priority.py \
            PFRAMOS/tests/test_memory_return_to_middle_pool.py \
            PFRAMOS/tests/test_pacc_publication_record.py \
            PFRAMOS/tests/test_purpose_priority_memory_distribution.py \
            PFRAMOS/tests/test_rar_guided_dmacce.py

      - name: Generate controlled pilot manifest
        env:
          PILOT_MODE: ${{ inputs.mode }}
          PILOT_LANE: ${{ inputs.lane }}
        run: |
          mkdir -p PFRAMOS/trial_runs/latest
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          manifest = {
              "trial_id": "PACC-TRIAL-001",
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "status": "shadow_only",
              "mode": os.environ["PILOT_MODE"],
              "lane": os.environ["PILOT_LANE"],
              "parameter_updates_applied": False,
              "external_dataset_downloaded": False,
              "publication_evidence": False,
              "next_gate": "approved_dataset_manifest",
              "required_records": [
                  "dataset_manifest",
                  "permission_gate",
                  "protected_test",
                  "pimf_analysis",
                  "pframos_decision",
                  "pcece_record",
                  "dmacce_record",
                  "publication_routing_record"
              ]
          }
          with open("PFRAMOS/trial_runs/latest/pacc_trial_manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
          PY

      - name: Upload controlled pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacc-controlled-training-pilot
          path: PFRAMOS/trial_runs/latest/
          retention-days: 30
