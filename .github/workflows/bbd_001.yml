name: BBD Black Box Decryption

on:
  pull_request:
    branches: [main]
    paths:
      - 'Advanced_Extension_Series/BBD_Black_Box_Decryption/**'
      - 'Advanced_Extension_Series/SOC_Surrogate_Optimisation_Competition/**'
      - 'PFRAMOS/data/recovered_exact_history.csv'
      - 'Week_12/week_12_inputs.csv'
      - 'Week_12/week_12_results.csv'
      - 'Week_13/week_13_inputs.csv'
      - 'Week_13/week_13_results.csv'
      - '.github/workflows/bbd_001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bbd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BBD dependencies
        run: python -m pip install -r Advanced_Extension_Series/BBD_Black_Box_Decryption/requirements-bbd.txt
      - name: Run BBD 001
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_001_system_identification.py
      - name: Run BBD 002
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_002_temporal_residuals.py
      - name: Run BBD 003
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_003_gradient_reconstruction.py
      - name: Run BBD 004
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_004_symbolic_recovery.py
      - name: Run BBD 005
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_005_benchmark_matching.py
      - name: Run BBD 006
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_006_decryption_confidence.py
      - name: Run BBD 007
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_007_bbd_vs_soc_challenge.py
      - name: Run BBD 008
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_008_discriminatory_query_design.py
      - name: Run BBD 009
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_009_prospective_confidence.py
      - name: Run BBD 010
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_010_f6_specific_decryption.py
      - name: Run BBD 011
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_011_f6_residual_decomposition.py
      - name: Run BBD 012
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_012_f6_stochastic_deterministic.py
      - name: Run BBD 013
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_013_f6_latent_variable_reconstruction.py
      - name: Run BBD 014
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_014_f6_deterministic_surface_refinement.py
      - name: Run BBD 015
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_015_f6_repeat_pair_forensics.py
      - name: Run BBD 016
        run: python Advanced_Extension_Series/BBD_Black_Box_Decryption/bbd_016_f6_repeatability_hypothesis_testing.py
      - name: Upload BBD outputs
        uses: actions/upload-artifact@v4
        with:
          name: BBD-results
          path: Advanced_Extension_Series/BBD_Black_Box_Decryption/outputs/*.csv
