name: Final repository audit

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'Results/**'
      - 'Week_*/**'
      - 'Module_25_Final_BBO_Submission/**'
      - 'BBO_Visual_Book_Shiny/**'
      - 'tools/repository_audit.py'
      - 'requirements-final.txt'
      - '.github/workflows/final_repository_audit.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository audit
        run: python tools/repository_audit.py

      - name: Check Shiny Visual Book syntax
        run: python -m py_compile BBO_Visual_Book_Shiny/app.py

      - name: Reproduce Week 13 final analysis
        run: python Week_13/week_13_analysis.py

      - name: Install figure dependency
        run: python -m pip install -r requirements-final.txt

      - name: Reproduce Week 13 figures
        run: python Week_13/generate_week_13_figures.py

      - name: Execute final assessment notebook cells
        run: python tools/validate_final_notebook.py

      - name: Verify generated Week 13 figures
        run: |
          test -s Week_13/week_13_figure_1_final_change.png
          test -s Week_13/week_13_figure_2_normalised_progress.png
          test -s Week_13/week_13_figure_3_function_5_trajectory.png
          test -s Week_13/week_13_figure_4_latest_best_round.png
          echo 'All four Week 13 analytical figures generated successfully.'

