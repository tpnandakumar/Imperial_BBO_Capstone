name: PFRAMOS Training Scout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Validate Training Scout contracts
        run: python -m pytest PFRAMOS/tests/test_training_scout.py -q

      - name: Prepare ephemeral Schooling folders
        run: |
          mkdir -p Schooling/incoming
          mkdir -p Schooling/quarantine
          mkdir -p Schooling/approved
          mkdir -p Schooling/active_session
          mkdir -p Schooling/rejected
          mkdir -p Schooling/manifests

      - name: Record dry-run status
        run: |
          cat > Schooling/manifests/training_scout_status.txt <<'EOF'
          Training Scout validation passed.
          Discovery mode: dry run.
          No external dataset downloaded.
          No training performed.
          Production model unchanged.
          EOF

      - name: Upload scout manifest artefact
        uses: actions/upload-artifact@v4
        with:
          name: pframos-training-scout-status
          path: Schooling/manifests/
          retention-days: 30
