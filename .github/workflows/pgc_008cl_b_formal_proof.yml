name: PGC 008CL-B Formal Proof

on:
  workflow_dispatch:
  push:
    paths:
      - 'PGC/experiments/PGC_EXPERIMENT_008CL_B_DEPENDENCY_ENABLED_FORMAL_PROOF/**'
      - '.github/workflows/pgc_008cl_b_formal_proof.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'PGC/experiments/PGC_EXPERIMENT_008CL_B_DEPENDENCY_ENABLED_FORMAL_PROOF/**'
      - '.github/workflows/pgc_008cl_b_formal_proof.yml'

permissions:
  contents: read

jobs:
  formal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: PGC/experiments/PGC_EXPERIMENT_008CL_B_DEPENDENCY_ENABLED_FORMAL_PROOF/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r PGC/experiments/PGC_EXPERIMENT_008CL_B_DEPENDENCY_ENABLED_FORMAL_PROOF/requirements.txt

      - name: Run formal verification and property-based testing
        run: |
          python PGC/experiments/PGC_EXPERIMENT_008CL_B_DEPENDENCY_ENABLED_FORMAL_PROOF/run_formal_verification.py

      - name: Upload proof artefacts
        uses: actions/upload-artifact@v4
        with:
          name: pgc-008cl-b-formal-proof-results
          path: |
            PGC/experiments/PGC_EXPERIMENT_008CL_B_DEPENDENCY_ENABLED_FORMAL_PROOF/formal_results.csv
            PGC/experiments/PGC_EXPERIMENT_008CL_B_DEPENDENCY_ENABLED_FORMAL_PROOF/results_summary.json
          if-no-files-found: error
          retention-days: 30
