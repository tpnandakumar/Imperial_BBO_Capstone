name: PFRAMOS technology validation

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

jobs:
  validate-recruitment:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run recruitment tests
        run: python -m pytest PFRAMOS/tests/test_tech_sweep.py -q

      - name: Refresh Sunday discovery sweep
        run: python -m PFRAMOS.tech_sweep.run_sweep

      - name: Validate quarantined recruitment candidates
        run: python -m PFRAMOS.tech_sweep.validate_recruitment

      - name: Upload validation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pframos-tech-validation-public-audit
          path: PFRAMOS/outputs/public/tech_sweep/
          retention-days: 30

      - name: Upload private validation decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pframos-tech-validation-private-decisions
          path: PFRAMOS/outputs/private/tech_sweep/
          retention-days: 30
