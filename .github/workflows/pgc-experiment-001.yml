name: PGC Validation and Experiments

on:
  workflow_dispatch:
  push:
    branches:
      - agent/pframos-v0.1
    paths:
      - "PGC/**"
      - ".github/workflows/pgc-experiment-001.yml"
  pull_request:
    paths:
      - "PGC/**"
      - ".github/workflows/pgc-experiment-001.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  test-and-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pytest numpy scikit-learn

      - name: Run PGC unit tests
        run: python -m pytest PGC/tests -q

      - name: Execute PGC Experiment 001
        run: |
          python PGC/experiments/PGC_EXPERIMENT_001/run_experiment.py \
            --per-family 100 \
            --seeds 11,23,37,53,71 \
            --output PGC/experiments/PGC_EXPERIMENT_001/results.json

      - name: Execute PGC Experiment 002
        run: |
          python PGC/experiments/PGC_EXPERIMENT_002/run_experiment.py \
            --seeds 11,23,37,53,71 \
            --bootstrap-resamples 100 \
            --output PGC/experiments/PGC_EXPERIMENT_002/results.json

      - name: Execute PGC Experiment 003
        run: |
          python PGC/experiments/PGC_EXPERIMENT_003/run_experiment.py \
            --per-family 100 \
            --seeds 11,23,37,53,71 \
            --output PGC/experiments/PGC_EXPERIMENT_003/results.json

      - name: Validate result records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          experiment_001 = json.loads(
              Path("PGC/experiments/PGC_EXPERIMENT_001/results.json").read_text(
                  encoding="utf-8"
              )
          )
          experiment_002 = json.loads(
              Path("PGC/experiments/PGC_EXPERIMENT_002/results.json").read_text(
                  encoding="utf-8"
              )
          )
          experiment_003 = json.loads(
              Path("PGC/experiments/PGC_EXPERIMENT_003/results.json").read_text(
                  encoding="utf-8"
              )
          )

          assert experiment_001["state"] == "completed_trial"
          assert experiment_001["publication_evidence"] is False
          assert experiment_001["total_cases_per_seed"] == 500
          assert "pgc_evidence_router" in experiment_001["aggregate"]

          assert experiment_002["state"] == "completed_trial"
          assert experiment_002["dataset"]["uci_id"] == 53
          assert experiment_002["dataset"]["licence"] == "CC BY 4.0"
          assert experiment_002["protected_test_used_for_routing"] is False
          assert experiment_002["publication_evidence"] is False
          assert experiment_002["trial_evidence"] is True
          assert "pgc_evidence_router" in experiment_002["aggregate"]

          assert experiment_003["state"] == "completed_trial"
          assert experiment_003["publication_evidence"] is False
          assert experiment_003["trial_evidence"] is True
          assert experiment_003["factual_accuracy_precedence"] is True
          assert experiment_003["safety_precedence"] is True
          assert experiment_003["phcs_coherence_enabled"] is True
          assert experiment_003["total_cases_per_seed"] == 600
          assert "pgc_perception_emotion" in experiment_003["aggregate"]
          assert "pgc_without_coherence" in experiment_003["aggregate"]

          print(json.dumps({
              "experiment_001": {
                  "promotion_candidate": experiment_001["promotion_candidate"],
                  "strongest_non_oracle_baseline": experiment_001[
                      "strongest_non_oracle_baseline"
                  ],
              },
              "experiment_002": {
                  "promotion_candidate": experiment_002["promotion_candidate"],
                  "strongest_non_oracle_baseline": experiment_002[
                      "strongest_non_oracle_baseline"
                  ],
                  "pgc": experiment_002["aggregate"]["pgc_evidence_router"],
              },
              "experiment_003": {
                  "promotion_candidate": experiment_003["promotion_candidate"],
                  "strongest_non_oracle_baseline": experiment_003[
                      "strongest_non_oracle_baseline"
                  ],
                  "pgc": experiment_003["aggregate"]["pgc_perception_emotion"],
              },
          }, indent=2))
          PY

      - name: Upload PGC experiment results
        uses: actions/upload-artifact@v4
        with:
          name: pgc-experiment-results
          path: |
            PGC/experiments/PGC_EXPERIMENT_001/results.json
            PGC/experiments/PGC_EXPERIMENT_002/results.json
            PGC/experiments/PGC_EXPERIMENT_003/results.json
          retention-days: 30
