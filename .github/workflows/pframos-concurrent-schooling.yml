name: PFRAMOS Concurrent Schooling

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'

permissions:
  contents: read

concurrency:
  group: pframos-concurrent-schooling
  cancel-in-progress: false

jobs:
  validate-controller:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Validate concurrent schooling contracts
        run: python -m pytest PFRAMOS/tests/test_concurrent_training.py -q

      - name: Prepare isolated lane folders
        run: |
          for lane in optimisation bias robustness efficiency emergence reasoning; do
            mkdir -p "Schooling/concurrent/$lane/input"
            mkdir -p "Schooling/concurrent/$lane/checkpoint"
            mkdir -p "Schooling/concurrent/$lane/results"
            mkdir -p "Schooling/concurrent/$lane/logs"
          done
          mkdir -p Schooling/concurrent/master_logs

      - name: Record validation-only schooling manifest
        run: |
          cat > Schooling/concurrent/master_logs/concurrent_schooling_status.txt <<'EOF'
          Concurrent Schooling controller validation passed.
          Mode: architecture validation only.
          No external dataset downloaded.
          No model training performed.
          No production checkpoint modified.
          Isolated lane and permanent log controls active.
          EOF

      - name: Upload schooling status artefact
        uses: actions/upload-artifact@v4
        with:
          name: pframos-concurrent-schooling-status
          path: Schooling/concurrent/master_logs/
          retention-days: 30
